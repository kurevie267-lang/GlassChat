name: Build GlassChat APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip python3-venv \
            build-essential libssl-dev libffi-dev python3-dev \
            libncurses5-dev libncursesw5-dev zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev llvm libxml2-dev libxslt1-dev \
            liblzma-dev ccache autoconf libtool pkg-config

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer cython==0.29.36

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Patch p4a pip upgrade bug
        run: |
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          mkdir -p "$HOME/.buildozer/android/platform"
          if [ ! -d "$P4A_DIR/.git" ]; then
            echo "Cloning p4a (develop) ..."
            git clone --depth 1 -b develop https://github.com/kivy/python-for-android.git "$P4A_DIR"
          else
            echo "Updating p4a ..."
            cd "$P4A_DIR" && git fetch --depth 1 origin develop && git checkout -f develop && git reset --hard origin/develop
          fi
          echo "Patching pip upgrade to pinned version ..."
          python3 - <<'EOF'
from pathlib import Path
p = Path.home() / '.buildozer/android/platform/python-for-android/pythonforandroid/build.py'
src = p.read_text(encoding='utf-8')
old = 'pip install -U pip'
new = "pip install -U 'pip==23.0.1'"
if old in src:
    p.write_text(src.replace(old, new), encoding='utf-8')
    print('PATCHED: pip upgrade pinned to 23.0.1')
else:
    print('NOTE: pattern not found (p4a may already be fixed), checking current line ...')
    for line in src.splitlines():
        if 'pip install' in line and 'Upgrade' in line:
            print('LINE:', line.strip())
EOF

      - name: Build debug APK
        run: |
          rm -rf .buildozer
          buildozer android debug 2>&1 | tee buildozer-output.log || {
            echo "========== BUILD FAILED =========="
            echo "Showing last 200 lines of .buildozer log:"
            find .buildozer -name '*.log' -type f -exec tail -200 {} \; || true
            echo "========== Full buildozer output (last 300 lines) =========="
            tail -300 buildozer-output.log || true
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassChat-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/**/*.log
            buildozer-output.log
            buildozer.spec
          if-no-files-found: ignore
