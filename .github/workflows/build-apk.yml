name: Build GlassChat APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip python3-venv \
            build-essential libssl-dev libffi-dev python3-dev \
            libncurses5-dev libncursesw5-dev zlib1g-dev libbz2-dev \
            libreadline-dev libsqlite3-dev llvm libxml2-dev libxslt1-dev \
            liblzma-dev ccache autoconf libtool pkg-config

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer cython==0.29.36

      - name: Cache Buildozer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        run: |
          rm -rf .buildozer
          buildozer android debug 2>&1 | tee buildozer-output.log || {
            echo "========== BUILD FAILED =========="
            echo "Showing last 200 lines of .buildozer log:"
            find .buildozer -name '*.log' -type f -exec tail -200 {} \; || true
            echo "========== Full buildozer output (last 300 lines) =========="
            tail -300 buildozer-output.log || true
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassChat-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/**/*.log
            buildozer-output.log
            buildozer.spec
          if-no-files-found: ignore
